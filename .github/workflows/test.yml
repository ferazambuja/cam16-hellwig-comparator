name: test

# The tool itself needs no packages. Every job below runs it on a bare
# interpreter; only the differential installs anything, and it installs an
# independent implementation to check this one against, not a dependency of
# it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The floor and the current release on Linux, plus one job on each
        # other platform. setup-python documents `python` as its cross-platform
        # command, so every matrix leg uses the same invocation.
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit and command-line suite
        run: python tests/test_cam16_compare.py
      - name: Execute every README command
        run: python tests/test_readme_examples.py
      - name: Differential parses and skips without the oracle
        run: python tests/test_cam16_colour_differential.py
      - name: The documented example runs
        run: >
          python cam16_compare.py --input-csv examples/samples.csv
          --white 95.047 100 108.883 --la 20 --yb 20

  colour-differential:
    name: colour-0.4.7-differential
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install the pinned comparison oracle
        run: python -m pip install "colour-science==0.4.7"
      - name: Compare both forward models against Colour
        run: python tests/test_cam16_colour_differential.py

  browser-parity:
    name: browser parity (${{ matrix.os }}, Node 20)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Browser module unit suite
        run: python tests/test_cam16_js_unit.py
      - name: Compare browser and Python implementations
        run: python tests/test_cam16_js_parity.py
